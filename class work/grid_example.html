<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID EXAMPLE</title>
</head>
<style>
    body{
        font-family:Arial ;
        background-color: #f4f6f9;
        
    }
    
    .container{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 100px 100px;
        grid-template-areas:
        "cse ece It" 
        "ai cyber data";

        grid-auto-flow: row;
        grid-auto-rows: 100px;
        grid-auto-columns: 130px;
        


    }
    
    
</style>
<body>
    
</body>
<h2>COURSE DASHBOARD</h2>
<div class="container">
    <div class="box">CSE</div>
    <div class="box">ECE</div>
    <div class="box">IT</div>
    <div class="box">AI</div>
    <div class="box">CYBER SECURITY</div>
    <div class="box">Data Science</div>

</div>
</html>
